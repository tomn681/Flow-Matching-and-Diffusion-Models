[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genlib"
version = "0.9.0"
description = "Flow matching, diffusion, and latent generative modeling library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Flow Matching and Diffusion Models contributors" }
]
dependencies = [
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "numpy>=1.23.0",
  "pandas>=1.5.0",
  "pydicom>=2.3.0",
  "scikit-image>=0.21.0",
  "Pillow>=9.5.0",
  "tqdm>=4.65.0",
  "torchinfo>=1.8.0",
  "diffusers>=0.24.0",
  "safetensors>=0.4.0",
  "transformers>=4.36.0",
  "lpips>=0.1.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "mypy>=1.11.0"
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.26.0"
]

[project.scripts]
genlib = "genlib.cli:main"

[project.entry-points."genlib.plugins"]
builtin = "src.plugins.builtin:register"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src*", "genlib*"]

[tool.setuptools.package-data]
src = ["py.typed"]
